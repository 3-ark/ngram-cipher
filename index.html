<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English N-Gram Cipher Tester</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h1 {
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 16px;
    }
    input[type="text"], input[type="number"], input[type="password"], select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: inherit;
    }
    textarea {
      height: 110px;
      resize: vertical;
    }
    .llm-panel {
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.secondary {
      background-color: #475569;
    }
    button.secondary:hover {
      background-color: #334155;
    }
    .info-status {
      font-size: 14px;
      color: #0369a1;
      background-color: #e0f2fe;
      border: 1px solid #bae6fd;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }
    .error {
      color: #dc2626;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>🔏 English N-Gram Cipher Tester</h1>

  <div class="card">
    <label for="password">Secret Password / Key</label>
    <input type="password" id="password" placeholder="Enter password..." value="MySecretKey123">

    <label for="plaintext">Plaintext</label>
    <textarea id="plaintext" placeholder="Type message to encode...">Hello world! This secret message will be encoded into natural English text.</textarea>

    <label for="style">Writing style</label>
    <select id="style">
      <option value="news">News prose (Google N-Gram LM)</option>
      <option value="poetry">Poetry (Dynamic Stanzas)</option>
      <option value="llm">LLM ONNX Mode (Transformers.js)</option>
    </select>

    <div id="llmPanel" class="llm-panel">
      <label for="llmModel">Hugging Face Model ID or URL</label>
      <input type="text" id="llmModel" value="Xenova/gpt2" placeholder="e.g. Xenova/gpt2 or onnx-community/Supra-Mini-v2-0.1M-ONNX">
      <small style="color: #64748b;">Accepts model IDs (e.g. <code>Xenova/gpt2</code>) or Hugging Face URLs. Model downloads directly from Hugging Face on first run and caches in browser IndexedDB.</small>

      <label for="llmPrompt">Generation Prompt Context</label>
      <input type="text" id="llmPrompt" value="In recent news," placeholder="Prompt context for model generation">

      <label for="bitsPerToken">Bits Embedded Per Token (1-8 bits)</label>
      <input type="number" id="bitsPerToken" min="1" max="8" value="4">
    </div>

    <div id="infoStatus" class="info-status"></div>

    <div class="btn-group">
      <button id="encodeBtn">🔒 Encode to English Prose</button>
      <button id="decodeBtn" class="secondary">🔓 Decode to Plaintext</button>
    </div>

    <div id="error" class="error"></div>

    <label for="ciphertext">English N-Gram Ciphertext</label>
    <textarea id="ciphertext" placeholder="Encoded English ciphertext will appear here..."></textarea>
  </div>

  <script type="module">
    import { encode, decode, normalizeModelName } from './src/index.ts';

    const plaintextEl = document.getElementById('plaintext');
    const ciphertextEl = document.getElementById('ciphertext');
    const passwordEl = document.getElementById('password');
    const styleEl = document.getElementById('style');
    const llmPanelEl = document.getElementById('llmPanel');
    const llmModelEl = document.getElementById('llmModel');
    const llmPromptEl = document.getElementById('llmPrompt');
    const bitsPerTokenEl = document.getElementById('bitsPerToken');
    const encodeBtnEl = document.getElementById('encodeBtn');
    const decodeBtnEl = document.getElementById('decodeBtn');
    const infoStatusEl = document.getElementById('infoStatus');
    const errorEl = document.getElementById('error');

    function updateStyleUI() {
      const selectedStyle = styleEl.value;
      if (selectedStyle === 'llm') {
        llmPanelEl.style.display = 'block';
        encodeBtnEl.textContent = '🤖 Encode with ONNX LLM';
        decodeBtnEl.textContent = '🔓 Decode with ONNX LLM';
      } else if (selectedStyle === 'poetry') {
        llmPanelEl.style.display = 'none';
        encodeBtnEl.textContent = '🔒 Encode to Poetry';
        decodeBtnEl.textContent = '🔓 Decode to Plaintext';
      } else {
        llmPanelEl.style.display = 'none';
        encodeBtnEl.textContent = '🔒 Encode to English Prose';
        decodeBtnEl.textContent = '🔓 Decode to Plaintext';
      }
    }

    styleEl.addEventListener('change', updateStyleUI);
    styleEl.addEventListener('input', updateStyleUI);
    updateStyleUI();

    llmModelEl.addEventListener('blur', () => {
      const normalized = normalizeModelName(llmModelEl.value);
      if (normalized && normalized !== llmModelEl.value.trim()) {
        llmModelEl.value = normalized;
      }
    });

    function showError(msg) {
      if (msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      } else {
        errorEl.style.display = 'none';
      }
    }

    function showStatus(msg) {
      if (msg) {
        infoStatusEl.textContent = msg;
        infoStatusEl.style.display = 'block';
      } else {
        infoStatusEl.style.display = 'none';
      }
    }

    function buildOptions() {
      const selectedStyle = styleEl.value;
      if (selectedStyle === 'llm') {
        return {
          encoding: {
            style: 'llm',
            llmModel: normalizeModelName(llmModelEl.value) || 'Xenova/gpt2',
            llmPrompt: llmPromptEl.value.trim() || 'In recent news,',
            bitsPerToken: parseInt(bitsPerTokenEl.value, 10) || 4
          }
        };
      }
      return {
        encoding: {
          style: selectedStyle
        }
      };
    }

    encodeBtnEl.addEventListener('click', async () => {
      showError(null);
      try {
        const text = plaintextEl.value;
        const pass = passwordEl.value;
        if (!text) return showError('Please enter plaintext to encode.');
        if (!pass) return showError('Please enter a password.');

        if (styleEl.value === 'llm') {
          showStatus(`⏳ Downloading / loading ONNX model '${normalizeModelName(llmModelEl.value)}' from Hugging Face...`);
        } else {
          showStatus(null);
        }

        const result = await encode(text, pass, buildOptions());
        ciphertextEl.value = result;
        showStatus(styleEl.value === 'llm' ? '✅ Encoding complete! ONNX model cached in browser IndexedDB.' : null);
      } catch (err) {
        showStatus(null);
        showError(err.message || 'Encoding error occurred.');
      }
    });

    decodeBtnEl.addEventListener('click', async () => {
      showError(null);
      try {
        const cipher = ciphertextEl.value;
        const pass = passwordEl.value;
        if (!cipher) return showError('Please enter English ciphertext to decode.');
        if (!pass) return showError('Please enter a password.');

        if (styleEl.value === 'llm') {
          showStatus(`⏳ Loading ONNX model '${normalizeModelName(llmModelEl.value)}' for decoding...`);
        } else {
          showStatus(null);
        }

        const result = await decode(cipher, pass, buildOptions());
        plaintextEl.value = result;
        showStatus(styleEl.value === 'llm' ? '✅ Decoding complete!' : null);
      } catch (err) {
        showStatus(null);
        showError(err.message || 'Decoding error occurred.');
      }
    });
  </script>
</body>
</html>
